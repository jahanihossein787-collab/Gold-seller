<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>دفتر معاملات طلا و سکه</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14110a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر طلا">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');

:root{
  --gold:#e8b14a; --gold2:#f6d365; --buy:#3fbf6f; --sell:#e8554e;
  --bg:#0a0805; --txt:#f3e9d2; --muted:#a8997a; --line:rgba(230,200,120,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Vazirmatn',Tahoma,sans-serif;
  background:radial-gradient(circle at 18% 0%,#2a2410 0%,#14110a 45%,#0a0805 100%);
  color:var(--txt); min-height:100vh;
}
.wrap{max-width:680px;margin:0 auto;padding:22px 14px 80px}
input::placeholder{color:#8a7c5c}
input,select,button{font-family:inherit}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.rec-row{animation:slideIn .25s ease}

/* سطر معامله با کشیدن به سمت چپ (مثل تلگرام) */
.swipe{position:relative;border-radius:10px;margin-bottom:8px;background:#1c160c;overflow:hidden}
.swipe-actions{position:absolute;top:0;bottom:0;right:0;display:flex;align-items:stretch;z-index:1}
.swipe-actions button{border:none;color:#fff;font-weight:700;font-size:12px;cursor:pointer;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.swipe-actions .ico{font-size:18px;line-height:1}
.act-edit{background:#c9962f}
.act-del{background:#e8554e}
.swipe-content{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;
  padding:11px 12px;background:#1c160c;transition:transform .22s cubic-bezier(.22,.61,.36,1);
  will-change:transform;touch-action:pan-y}
.swipe-main{overflow:hidden;flex:1;min-width:0}

h1{font-size:32px;font-weight:900;text-align:center;margin:4px 0 2px;
  background:linear-gradient(90deg,#f6d365,#e8b14a 50%,#c9962f);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}

.tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:14px;margin-bottom:18px}
.tab{flex:1;padding:11px 4px;border:none;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px;
  color:#bfae84;background:transparent;transition:all .15s}
.tab.active{color:#1a1408;background:linear-gradient(90deg,#f6d365,#e8b14a)}

.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
label{display:block;font-size:13px;color:#c9b88c;margin-bottom:6px;font-weight:600}
.inp,select.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(230,200,120,.22);
  background:rgba(0,0,0,.3);color:var(--txt);font-size:16px;outline:none}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;color-scheme:dark;
  background-color:#1d1810;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(14px) calc(1em + 4px),calc(20px) calc(1em + 4px);background-size:6px 6px,6px 6px;background-repeat:no-repeat;
  border-color:rgba(230,180,80,.4)}
select.inp:focus{border-color:var(--gold)}
select.inp option{background:#1d1810;color:#f3e9d2;padding:10px}
select.inp option:checked{background:#3a2f17;color:var(--gold)}
.row{display:flex;gap:10px}
.row>div{flex:1}
.mb{margin-bottom:14px}

.tgl{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.2);color:#9a8c6c;font-weight:800;font-size:16px;cursor:pointer;transition:all .15s}
.tgl.buy.on{border:2px solid var(--buy);background:rgba(63,191,111,.13);color:var(--buy)}
.tgl.sell.on{border:2px solid var(--sell);background:rgba(232,85,78,.13);color:var(--sell)}

.btn-primary{width:100%;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;
  color:#1a1408;background:linear-gradient(90deg,#f6d365,#e8b14a);box-shadow:0 8px 24px rgba(230,180,80,.35)}

.day-header{font-size:13px;font-weight:700;color:var(--gold);background:rgba(230,180,80,.08);
  border-right:3px solid var(--gold);padding:6px 12px;border-radius:0 8px 8px 0;margin:0 0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{background:rgba(255,255,255,.03);border-radius:16px;padding:12px;min-height:90px}
.col.buy{border:1px solid rgba(63,191,111,.2)}
.col.sell{border:1px solid rgba(232,85,78,.2)}
.col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.col-title.buy{color:var(--buy)} .col-title.sell{color:var(--sell)}
.col-title{font-weight:800;font-size:16px}
.pill{font-size:12px;color:var(--muted);background:rgba(0,0,0,.25);padding:3px 9px;border-radius:20px}
.rec{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.22);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.rec-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-sub{font-size:11px;color:#8a7c5c}
.rec-val.buy{color:var(--buy)} .rec-val.sell{color:var(--sell)}
.rec-val{font-weight:800;font-size:14px}
.del{background:none;border:none;color:#7a6f50;cursor:pointer;font-size:18px;line-height:1;padding:2px}
.tot{border-top:1px dashed;margin-top:6px;padding-top:8px;font-size:12px}
.tot.buy{border-color:rgba(63,191,111,.27)} .tot.sell{border-color:rgba(232,85,78,.27)}
.tot-row{display:flex;justify-content:space-between;padding:2px 0}

.empty{text-align:center;color:#6f6448;margin-top:26px;font-size:14px}

.person-card{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.03);
  border:1px solid rgba(230,200,120,.15);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.person-card:hover{background:rgba(230,200,120,.1)}
.back{background:none;border:1px solid rgba(230,200,120,.25);color:#c9b88c;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.stat{background:rgba(255,255,255,.03);border-radius:12px;padding:10px 14px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:900;margin-top:2px}
.out-btns{display:flex;gap:10px;margin-bottom:20px}
.out{flex:1;padding:12px;border-radius:12px;border:1.5px solid;background:rgba(0,0,0,.25);color:var(--txt);font-weight:700;font-size:14px;cursor:pointer}

.sug{position:absolute;top:calc(100% + 4px);right:0;left:0;background:#1d1810;border:1px solid rgba(230,200,120,.25);
  border-radius:12px;overflow:hidden;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.sug div{padding:10px 14px;cursor:pointer;font-size:15px;border-bottom:1px solid rgba(255,255,255,.05)}
.sug div:hover{background:rgba(230,200,120,.12)}

.footer-note{text-align:center;color:#5f553c;font-size:11px;margin-top:30px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>دفتر معاملات طلا و سکه</h1>
  <div class="sub">ثبت خرید و فروش · تفکیک روزانه · خروجی هر شخص</div>

  <div class="tabs">
    <button class="tab active" data-tab="register">ثبت معامله</button>
    <button class="tab" data-tab="search">جستجوی اشخاص</button>
  </div>

  <div id="view"></div>

  <div class="footer-note">
    اطلاعات روی همین دستگاه ذخیره می‌شود و با بستن صفحه پاک نمی‌شود.<br>
    برای پاک کردن کامل از دکمه‌ی پاک‌سازی در پایین استفاده کنید.
  </div>
</div>

<div id="confirm-overlay" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:24px">
  <div style="background:#1d1810;border:1px solid rgba(230,200,120,.3);border-radius:16px;max-width:340px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.6)">
    <div id="confirm-msg" style="font-size:16px;font-weight:700;color:#f3e9d2;margin-bottom:18px;text-align:center;line-height:1.7">آیا مطمئنید؟</div>
    <div style="display:flex;gap:10px">
      <button id="confirm-no" style="flex:1;padding:12px;border-radius:12px;border:1px solid rgba(230,200,120,.25);background:transparent;color:#c9b88c;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit">انصراف</button>
      <button id="confirm-yes" style="flex:1;padding:12px;border-radius:12px;border:none;background:#e8554e;color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit">بله، حذف کن</button>
    </div>
  </div>
</div>

<script>
/* ---------- داده و ذخیره ---------- */
var STORE_KEY = "gold_coin_records_v1";
var records = [];
try { records = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch(e){ records = []; }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(records)); }

/* ---------- پنجره تأیید داخلی ---------- */
function askConfirm(message, onYes, yesLabel){
  var ov=document.getElementById("confirm-overlay");
  var msg=document.getElementById("confirm-msg");
  var yes=document.getElementById("confirm-yes");
  var no=document.getElementById("confirm-no");
  msg.textContent=message;
  yes.textContent=yesLabel||"بله، حذف کن";
  ov.style.display="flex";
  function close(){ ov.style.display="none"; yes.onclick=null; no.onclick=null; ov.onclick=null; }
  yes.onclick=function(){ close(); onYes(); };
  no.onclick=close;
  ov.onclick=function(e){ if(e.target===ov) close(); };
}

/* ---------- ابزار اعداد ---------- */
function toEn(s){
  return String(s)
    .replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)})
    .replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)});
}
function fmt(n){ return new Intl.NumberFormat("en-US").format(n); }
function formatLive(raw){
  var v = toEn(raw).replace(/[^0-9.]/g,"");
  if(v==="") return "";
  var parts = v.split(".");
  var intPart = parts[0].replace(/^0+(?=\d)/,"");
  var intF = intPart==="" ? "" : fmt(Number(intPart));
  if(parts.length>1){
    return intF + "." + parts[1];
  }
  return intF;
}
function parseLive(raw){ return toEn(raw).replace(/[^0-9.]/g,"").replace(/٫/g,"."); }

// ضریب تبدیل مثقال به گرم
var MESGHAL = 4.3318;
// ارزش ریالی هر معامله: طلا = (مظنه/4.3318)*وزن ، سکه = قیمت*تعداد
function recValue(r){
  if(r.cat==="coin"){ return r.price * r.count; }
  return (r.price / MESGHAL) * r.weight;
}

/* ---------- تاریخ ---------- */
function dayKey(d){ d=new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDay(d){ return new Intl.DateTimeFormat("fa-IR-u-nu-latn",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(new Date(d)); }
function fmtTime(d){ return new Intl.DateTimeFormat("fa-IR-u-nu-latn",{hour:"2-digit",minute:"2-digit"}).format(new Date(d)); }
function groupByDay(recs){
  var map={};
  recs.forEach(function(r){ var k=dayKey(r.time); (map[k]=map[k]||[]).push(r); });
  return Object.keys(map).sort().reverse().map(function(k){return [k,map[k]];});
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

var state = { tab:"register", cat:"gold", type:"buy", coin:COIN_TYPES[0], selectedPerson:null, searchQ:"", editId:null, pickedCode:"", filter:"all", goldMode:"weight", searchMode:"person", selectedDay:null, draftStat:true };

  if(state.tab==="register") renderRegister();
  else renderSearch();
}

function recLabel(r){
  if(r.cat==="coin"){ return esc(r.coin); }
  return esc(r.name);
}

function sectionHtml(title,cls,items){
  if(items.length===0) return "";
  var totVal=0, goldW=0, coinC=0;
  var rows = items.map(function(r){
    var sub, val;
    var off = !!r.excluded;
    if(r.cat==="coin"){
      if(!off) coinC += r.count;
      sub = fmtTime(r.time)+" · "+esc(r.coin)+" × "+fmt(r.count)+" · فی "+fmt(r.price);
      val = fmt(Math.round(recValue(r)));
    } else {
      if(!off) goldW += r.weight;
      sub = fmtTime(r.time)+" · "+fmt(r.weight)+" گرم · مظنه "+fmt(r.price);
      val = fmt(Math.round(recValue(r)));
    }
    if(!off) totVal += recValue(r);
    var dimStyle = off ? 'opacity:.45;' : '';
    var toggleBtn = '<button class="act-stat" data-stat="'+r.id+'" style="background:'+(off?'rgba(120,120,120,.2)':'rgba(63,191,111,.18)')+';border:none;color:'+(off?'#9a8c6c':'var(--buy)')+';border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:14px;flex-shrink:0;margin-left:6px" title="'+(off?'خارج از آمار':'در آمار')+'">'+(off?'☐':'☑')+'</button>';
    return '<div class="swipe rec-row" data-id="'+r.id+'" style="'+dimStyle+'">'+
        '<div class="swipe-actions">'+
          '<button class="act-edit" data-edit="'+r.id+'"><span class="ico">✎</span>اصلاح</button>'+
          '<button class="act-del" data-del="'+r.id+'"><span class="ico">🗑</span>حذف</button>'+
        '</div>'+
        '<div class="swipe-content">'+
          toggleBtn+
          '<div class="swipe-main">'+
            '<div class="rec-name">'+esc(r.name)+(r.code?' <span style="color:#8a7c5c;font-size:11px;font-weight:400">(کد '+esc(r.code)+')</span>':'')+(off?' <span style="color:#9a8c6c;font-size:10px">(خارج از آمار)</span>':'')+'</div>'+
            '<div class="rec-sub">'+sub+'</div>'+
          '</div>'+
          '<div class="rec-val '+cls+'" style="flex-shrink:0;margin-right:8px">'+val+'</div>'+
        '</div>'+
      '</div>';
  }).join("");

  var totHtml = '<div class="tot '+cls+'" style="margin:2px 2px 0">';
  if(goldW>0) totHtml += '<div class="tot-row"><span style="color:var(--muted)">جمع وزن طلا</span><span style="font-weight:800" class="rec-val '+cls+'">'+fmt(goldW)+' گرم</span></div>';
  if(coinC>0) totHtml += '<div class="tot-row"><span style="color:var(--muted)">تعداد سکه</span><span style="font-weight:800" class="rec-val '+cls+'">'+fmt(coinC)+'</span></div>';
  totHtml += '<div class="tot-row"><span style="color:var(--muted)">جمع مبلغ</span><span style="font-weight:800" class="rec-val '+cls+'">'+fmt(Math.round(totVal))+'</span></div></div>';

  return '<div class="col '+cls+'" style="margin-bottom:12px">'+
    '<div class="col-head sec-pick" data-sectype="'+cls+'" style="cursor:pointer">'+
      '<span class="col-title '+cls+'">'+title+' <span style="font-size:12px;font-weight:400;color:var(--muted)">+ ثبت</span></span>'+
      '<span class="pill">'+fmt(items.length)+' مورد</span>'+
    '</div>'+
    rows + totHtml +
  '</div>';
}

function sumOf(items){
  var s={w:0,c:0,amt:0};
  items.forEach(function(r){
    if(r.excluded) return;
    if(r.cat==="coin"){ s.c+=r.count; }
    else { s.w+=r.weight; }
    s.amt += recValue(r);
  });
  return s;
}
function dayTotalHtml(buys,sells){
  if(buys.length===0 && sells.length===0) return "";
  var b=sumOf(buys), s=sumOf(sells);
  function line(lbl,bv,sv){
    return '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px">'+
      '<span style="color:var(--muted)">'+lbl+'</span>'+
      '<span><span style="color:var(--buy);font-weight:800">'+bv+'</span>'+
      '<span style="color:#5f553c"> / </span>'+
      '<span style="color:var(--sell);font-weight:800">'+sv+'</span></span></div>';
  }
  var rows="";
  if(b.w>0||s.w>0) rows+=line("جمع وزن طلا (خرید/فروش)", fmt(b.w)+" گرم", fmt(s.w)+" گرم");
  if(b.c>0||s.c>0) rows+=line("تعداد سکه (خرید/فروش)", fmt(b.c), fmt(s.c));
  rows+=line("جمع مبلغ (خرید/فروش)", fmt(Math.round(b.amt)), fmt(Math.round(s.amt)));

  // بخش کسر/تفاوت خرید و فروش
  var diff="";
  if(b.w>0||s.w>0) diff+=diffLine("وزن طلا", b.w, s.w, " گرم");
  if(b.c>0||s.c>0) diff+=diffLine("تعداد سکه", b.c, s.c, "");
  diff+=diffLine("مبلغ", Math.round(b.amt), Math.round(s.amt), "");

  return '<div style="background:rgba(230,180,80,.06);border:1px solid rgba(230,180,80,.2);border-radius:12px;padding:10px 12px;margin-top:4px">'+
    '<div style="font-weight:800;color:var(--gold);font-size:13px;margin-bottom:6px">جمع کل روز</div>'+rows+
    '<div style="border-top:1px dashed rgba(230,180,80,.25);margin-top:8px;padding-top:8px">'+
      '<div style="font-weight:800;color:var(--gold);font-size:13px;margin-bottom:4px">کسر خرید و فروش</div>'+diff+
    '</div>'+
  '</div>';
}

// نمایش تفاوت خرید و فروش: مثبت یعنی فروش بیشتر، منفی یعنی خرید بیشتر
function diffLine(lbl, buyVal, sellVal, unit){
  var d = sellVal - buyVal;
  var color, text;
  if(d>0){ color="var(--sell)"; text=fmt(d)+unit+" بیشتر فروش"; }
  else if(d<0){ color="var(--buy)"; text=fmt(-d)+unit+" بیشتر خرید"; }
  else { color="var(--muted)"; text="برابر"; }
  return '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px">'+
    '<span style="color:var(--muted)">'+lbl+'</span>'+
    '<span style="color:'+color+';font-weight:800">'+text+'</span></div>';
}

function snapshotDraft(){
  var nm=document.getElementById("f-name");
  var pr=document.getElementById("f-price");
  var wt=document.getElementById("f-weight");
  var am=document.getElementById("f-amount");
  var ct=document.getElementById("f-count");
  state.draft={
    name: nm?nm.value:"",
    price: pr?pr.value:"",
    weight: wt?wt.value:"",
    amount: am?am.value:"",
    count: ct?ct.value:""
  };
}
function clearDraft(){ state.draft=null; }

function bindRegister(){
  // تب دسته
  document.querySelectorAll("[data-cat]").forEach(function(b){
    b.onclick=function(){ snapshotDraft(); state.cat=b.getAttribute("data-cat"); render(); };
  });
  // نوع معامله
  document.querySelectorAll("[data-type]").forEach(function(b){
    b.onclick=function(){ snapshotDraft(); state.type=b.getAttribute("data-type"); render(); };
  });

  var nameEl=document.getElementById("f-name");
  var priceEl=document.getElementById("f-price");
  var sugEl=document.getElementById("sug");

  if(priceEl) priceEl.oninput=function(){ priceEl.value=formatLive(priceEl.value); updateGoldCalc(); };
  var weightEl=document.getElementById("f-weight");
  if(weightEl) weightEl.oninput=function(){ weightEl.value=formatLive(weightEl.value); updateGoldCalc(); };
  var amountEl=document.getElementById("f-amount");
  if(amountEl) amountEl.oninput=function(){ amountEl.value=formatLive(amountEl.value); updateGoldCalc(); };
  var countEl=document.getElementById("f-count");
  if(countEl) countEl.oninput=function(){ countEl.value=formatLive(countEl.value); };
  var coinEl=document.getElementById("f-coin");
  if(coinEl) coinEl.onchange=function(){ state.coin=coinEl.value; };

  // سوییچ وزن/مبلغ طلا
  document.querySelectorAll(".gmode").forEach(function(b){
    b.addEventListener("click",function(e){
      e.preventDefault();
      snapshotDraft();
      state.goldMode=b.getAttribute("data-gmode");
      render();
    });
  });

  // چک‌باکس «در آمار حساب شود»
  var instatEl=document.getElementById("f-instat");
  if(instatEl) instatEl.onclick=function(){
    snapshotDraft();
    state.draftStat = (state.draftStat===false); // معکوس کن
    render();
  };

  // پیش‌نمایش محاسبه طلا
  function updateGoldCalc(){
    var calc=document.getElementById("gold-calc");
    if(!calc) return;
    var p=parseFloat(parseLive(priceEl.value));
    if(isNaN(p)||p<=0){ calc.textContent=""; return; }
    var perGram=p/MESGHAL;
    if(state.goldMode==="weight"){
      var w=weightEl?parseFloat(parseLive(weightEl.value)):NaN;
      if(isNaN(w)){ calc.textContent="نرخ هر گرم: "+fmt(Math.round(perGram))+" ریال"; return; }
      calc.textContent="ارزش: "+fmt(Math.round(perGram*w))+" ریال";
    } else {
      var amt=amountEl?parseFloat(parseLive(amountEl.value)):NaN;
      if(isNaN(amt)){ calc.textContent="نرخ هر گرم: "+fmt(Math.round(perGram))+" ریال"; return; }
      var wg=amt/perGram;
      calc.textContent="وزن معادل: "+fmt(Math.round(wg*1000)/1000)+" گرم";
    }
  }
  updateGoldCalc();

  // پیشنهاد اسم/کد از دفترچه اشخاص
  if(nameEl){
    nameEl.oninput=function(){
      state.pickedCode=""; // تا انتخاب نشده، کدی نیست
      var q=toEn(nameEl.value.trim());
      if(!q){ sugEl.style.display="none"; return; }
      var isNum=/^[0-9]+$/.test(q);
      var matches=[];
      for(var i=0;i<PERSONS.length;i++){
        var p=PERSONS[i];
        if(isNum){ if(p.c.indexOf(q)===0) matches.push(p); }
        else if(p.n.indexOf(q)>=0) matches.push(p);
        if(matches.length>=8) break;
      }
      // اسم‌هایی که قبلاً ثبت شده ولی در دفترچه نیستند
      if(!isNum){
        var seen={}; matches.forEach(function(m){seen[m.n]=1;});
        records.forEach(function(r){
          if(r.name.indexOf(q)>=0 && !seen[r.name]){ matches.push({c:r.code||"",n:r.name}); seen[r.name]=1; }
        });
      }
      if(matches.length===0){ sugEl.style.display="none"; return; }
      sugEl.innerHTML = matches.slice(0,8).map(function(m){
        var codeTag = m.c ? '<span style="color:#8a7c5c;font-size:12px;float:left">کد '+m.c+'</span>' : '';
        return '<div data-name="'+esc(m.n)+'" data-code="'+esc(m.c)+'">'+codeTag+esc(m.n)+'</div>';
      }).join("");
      sugEl.style.display="block";
      sugEl.querySelectorAll("[data-name]").forEach(function(d){
        d.onclick=function(){
          nameEl.value=d.getAttribute("data-name");
          state.pickedCode=d.getAttribute("data-code")||"";
          sugEl.style.display="none";
        };
      });
    };
    nameEl.onblur=function(){ setTimeout(function(){sugEl.style.display="none";},180); };
  }

  // افزودن یا ذخیره ویرایش
  document.getElementById("f-add").onclick=function(){
    var nm=(nameEl.value||"").trim();
    if(!nm){ nameEl.style.animation="none"; void nameEl.offsetWidth; nameEl.style.animation="shake .4s"; return; }
    var price=parseFloat(parseLive(priceEl.value));
    if(!priceEl.value || isNaN(price)) return;

    var code = state.pickedCode || "";
    if(!code){ // اگر اسم دقیقاً در دفترچه بود، کدش را پیدا کن
      for(var pi=0; pi<PERSONS.length; pi++){ if(PERSONS[pi].n===nm){ code=PERSONS[pi].c; break; } }
    }
    var data={ name:nm, code:code, cat:state.cat, type:state.type, price:price, excluded:(state.draftStat===false) };
    if(state.cat==="gold"){
      var w;
      if(state.goldMode==="amount"){
        var amt=amountEl?parseFloat(parseLive(amountEl.value)):NaN;
        if(isNaN(amt)||amt<=0) return;
        w = amt / (price / MESGHAL);   // وزن = مبلغ ÷ (مظنه÷4.3318)
        w = Math.round(w*1000)/1000;
      } else {
        w=parseFloat(parseLive(weightEl.value));
        if(!weightEl.value || isNaN(w)) return;
      }
      data.weight=w; data.coin=null; data.count=null;
    } else {
      var c=parseFloat(parseLive(countEl.value)); if(isNaN(c)||c<=0) c=1;
      data.coin=coinEl.value; data.count=c; data.weight=null;
    }

    if(state.editId){
      records=records.map(function(r){
        if(r.id==state.editId){ return Object.assign({},r,data); }
        return r;
      });
      state.editId=null;
    } else {
      data.id=Date.now()+"_"+Math.random().toString(36).slice(2,6);
      data.time=Date.now();
      records.unshift(data);
    }
    save(); state.pickedCode=""; state.draftStat=true; clearDraft(); render();
  };
  var cancelBtn=document.getElementById("f-cancel");
  if(cancelBtn) cancelBtn.onclick=function(){ state.editId=null; state.draftStat=true; clearDraft(); render(); };

  // حذف
  document.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click",function(e){
      e.preventDefault(); e.stopPropagation();
      var id=b.getAttribute("data-del");
      askConfirm("این معامله حذف شود؟", function(){
        records=records.filter(function(r){ return String(r.id)!==String(id); });
        save(); render();
      });
    });
  });

  // اصلاح
  document.querySelectorAll("[data-edit]").forEach(function(b){
    b.addEventListener("click",function(e){
      e.preventDefault(); e.stopPropagation();
      state.editId=b.getAttribute("data-edit");
      clearDraft();
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    });
  });

  // روشن/خاموش کردن «در آمار»
  document.querySelectorAll("[data-stat]").forEach(function(b){
    b.addEventListener("click",function(e){
      e.preventDefault(); e.stopPropagation();
      var id=b.getAttribute("data-stat");
      records=records.map(function(r){ if(String(r.id)===String(id)){ r.excluded=!r.excluded; } return r; });
      save(); render();
    });
  });

  // پاک‌سازی کلی
  var clr=document.getElementById("clear-all");
  if(clr) clr.onclick=function(){ askConfirm("همه اطلاعات پاک شود؟ این کار قابل بازگشت نیست.", function(){ records=[]; save(); render(); }, "بله، همه پاک شود"); };

  // دکمه‌های فیلتر همه/خرید/فروش
  document.querySelectorAll(".filt").forEach(function(b){
    b.addEventListener("click",function(e){
      e.stopPropagation();
      state.filter=b.getAttribute("data-filt");
      render();
    });
  });

  // ضربه روی سرتیتر خرید/فروش → فقط همون بخش نمایش داده شود
  document.querySelectorAll(".sec-pick").forEach(function(h){
    h.addEventListener("click",function(e){
      if(e.target.closest("button")) return; // دکمه خروجی روز را نادیده بگیر
      e.stopPropagation();
      var sec=h.getAttribute("data-sectype");
      state.filter = (state.filter===sec) ? "all" : sec; // ضربه دوباره = نمایش همه
      render();
    });
  });

  // خروجی متنی روزانه
  document.querySelectorAll(".day-exp").forEach(function(b){
    b.addEventListener("click",function(e){
      e.preventDefault(); e.stopPropagation();
      exportDayText(b.getAttribute("data-day"));
    });
  });
  // کپی متن روزانه
  document.querySelectorAll(".day-copy").forEach(function(b){
    b.addEventListener("click",function(e){
      e.preventDefault(); e.stopPropagation();
      copyDayText(b.getAttribute("data-day"), b);
    });
  });

  // کشیدن سطرها (مثل تلگرام)
  bindSwipe();
}

/* ---------- کشیدن سطر به چپ ---------- */
function bindSwipe(){
  var OPEN=124, THRESH=40;
  function closeAll(except){
    document.querySelectorAll(".swipe-content").forEach(function(c){
      if(c!==except && c.dataset.open==="1"){
        c.style.transition="transform .22s cubic-bezier(.22,.61,.36,1)";
        c.style.transform="translateX(0)"; c.dataset.open="0";
      }
    });
  }
  document.querySelectorAll(".swipe").forEach(function(row){
    var content=row.querySelector(".swipe-content");
    if(!content) return;
    content.dataset.open="0";
    var startX=0,startY=0,curX=0,dragging=false,decided=false,horizontal=false,moved=false;

    function isOpen(){ return content.dataset.open==="1"; }
    function settle(open){
      content.style.transition="transform .22s cubic-bezier(.22,.61,.36,1)";
      content.style.transform="translateX("+(open?-OPEN:0)+"px)";
      content.dataset.open=open?"1":"0";
    }
    function start(x,y){ startX=x; startY=y; curX=x; dragging=true; decided=false; horizontal=false; moved=false; }
    function moveTo(x,y){
      if(!dragging) return;
      var dx=x-startX, dy=y-startY;
      if(!decided){
        if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
        decided=true; horizontal=Math.abs(dx)>Math.abs(dy);
        if(horizontal) closeAll(content);
      }
      if(!horizontal) return;
      moved=true; curX=x;
      var base=isOpen()?-OPEN:0;
      var t=base+dx;
      if(t>0) t=0; if(t<-OPEN-25) t=-OPEN-25;
      content.style.transition="none";
      content.style.transform="translateX("+t+"px)";
    }
    function end(){
      if(!dragging) return; dragging=false;
      if(!horizontal||!moved) return;
      var dx=curX-startX;
      if(isOpen()) settle(!(dx>THRESH));   // باز بود: اگر به راست کشید، ببند
      else settle(dx<-THRESH);             // بسته بود: اگر به چپ کشید، باز کن
    }

    content.addEventListener("touchstart",function(e){ var t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
    content.addEventListener("touchmove",function(e){ var t=e.touches[0]; moveTo(t.clientX,t.clientY); },{passive:true});
    content.addEventListener("touchend",end);
    content.addEventListener("touchcancel",end);

    // ماوس برای دسکتاپ
    content.addEventListener("mousedown",function(e){ start(e.clientX,e.clientY); });
    content.addEventListener("mousemove",function(e){ if(dragging) moveTo(e.clientX,e.clientY); });
    content.addEventListener("mouseup",end);
    content.addEventListener("mouseleave",function(){ if(dragging) end(); });
  });

  // کلیک بیرون از سطرها همه را می‌بندد
  document.addEventListener("click",function(e){
    if(!e.target.closest(".swipe")) closeAll(null);
  },{once:true});
}

/* ---------- جستجو ---------- */
function renderSearch(){
  if(state.selectedPerson){ renderPerson(state.selectedPerson); return; }
  if(state.searchMode==="date" && state.selectedDay){ renderDayDetail(state.selectedDay); return; }

  // زیرتب اشخاص/تاریخ
  function sub(key,label){
    var on=state.searchMode===key;
    return '<button class="smode" data-smode="'+key+'" style="flex:1;padding:10px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:14px;color:'+(on?"#1a1408":"#bfae84")+';background:'+(on?"linear-gradient(90deg,#f6d365,#e8b14a)":"transparent")+'">'+label+'</button>';
  }
  var html='<div style="display:flex;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:12px;margin-bottom:16px">'+
    sub("person","بر اساس شخص")+ sub("date","بر اساس تاریخ")+'</div>';

  if(state.searchMode==="person"){
    html+='<input id="s-q" class="inp" style="margin-bottom:16px" type="text" placeholder="جستجوی نام یا کد شخص..." value="'+esc(state.searchQ)+'">';
    var counts={}, codeOf={};
    records.forEach(function(r){ counts[r.name]=(counts[r.name]||0)+1; if(r.code) codeOf[r.name]=r.code; });
    var qq=toEn(state.searchQ.trim());
    var names=Object.keys(counts).filter(function(n){
      if(!qq) return true;
      return n.indexOf(qq)>=0 || (codeOf[n]&&codeOf[n].indexOf(qq)===0);
    }).sort(function(a,b){return counts[b]-counts[a];});
    if(names.length===0){ html+='<div class="empty">شخصی پیدا نشد.</div>'; }
    else {
      names.forEach(function(n){
        var codeTag = codeOf[n] ? '<span style="color:#8a7c5c;font-size:11px;font-weight:400"> (کد '+esc(codeOf[n])+')</span>' : '';
        html+='<div class="person-card" data-person="'+esc(n)+'"><span style="font-weight:700;font-size:15px">'+esc(n)+codeTag+'</span><span class="pill">'+fmt(counts[n])+' معامله</span></div>';
      });
    }
  } else {
    // جستجو بر اساس تاریخ: لیست روزها
    var days=groupByDay(records);
    if(days.length===0){ html+='<div class="empty">معامله‌ای ثبت نشده.</div>'; }
    else {
      days.forEach(function(pair){
        var dkey=pair[0], items=pair[1];
        html+='<div class="person-card" data-day="'+dkey+'">'+
          '<span style="font-weight:700;font-size:14px">'+fmtDay(items[0].time)+'</span>'+
          '<span class="pill">'+fmt(items.length)+' معامله</span></div>';
      });
    }
  }

  viewEl.innerHTML=html;

  document.querySelectorAll(".smode").forEach(function(b){
    b.onclick=function(){ state.searchMode=b.getAttribute("data-smode"); state.selectedDay=null; render(); };
  });
  var q=document.getElementById("s-q");
  if(q) q.oninput=function(){ state.searchQ=q.value; var pos=q.selectionStart; renderSearch(); var nq=document.getElementById("s-q"); nq.focus(); nq.setSelectionRange(pos,pos); };
  document.querySelectorAll("[data-person]").forEach(function(c){
    c.onclick=function(){ state.selectedPerson=c.getAttribute("data-person"); render(); };
  });
  document.querySelectorAll("[data-day]").forEach(function(c){
    c.onclick=function(){ state.selectedDay=c.getAttribute("data-day"); render(); };
  });
}

function personStats(recs){
  var s={wBuy:0,wSell:0,cBuy:0,cSell:0,amtBuy:0,amtSell:0};
  recs.forEach(function(r){
    if(r.excluded) return;
    if(r.type==="buy"){
      if(r.cat==="coin"){ s.cBuy+=r.count; } else { s.wBuy+=r.weight; }
      s.amtBuy += recValue(r);
    } else {
      if(r.cat==="coin"){ s.cSell+=r.count; } else { s.wSell+=r.weight; }
      s.amtSell += recValue(r);
    }
  });
  return s;
}

/* ---------- دانلود متن ---------- */
function downloadText(filename, text){
  var blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ---------- ساخت متن یک روز ---------- */
function buildDayText(dkey){
  var items=records.filter(function(r){ return dayKey(r.time)===dkey; });
  if(items.length===0) return "";
  items.sort(function(a,b){ return a.time-b.time; });
  var buys=items.filter(function(r){return r.type==="buy";});
  var sells=items.filter(function(r){return r.type==="sell";});

  var t="معاملات روز "+fmtDay(items[0].time)+"\n"+Array(33).join("=")+"\n\n";

  function block(title, arr){
    if(arr.length===0) return "";
    var s="【 "+title+" 】\n";
    arr.forEach(function(r){
      var who=r.name+(r.code?" (کد "+r.code+")":"")+(r.excluded?" [خارج از آمار]":"");
      if(r.cat==="coin"){
        s+="• "+fmtTime(r.time)+" | "+who+" | سکه "+r.coin+" | تعداد "+fmt(r.count)+" | فی "+fmt(r.price)+" | مبلغ "+fmt(Math.round(recValue(r)))+"\n";
      } else {
        s+="• "+fmtTime(r.time)+" | "+who+" | طلا | مظنه "+fmt(r.price)+" | وزن "+fmt(r.weight)+" گرم | مبلغ "+fmt(Math.round(recValue(r)))+"\n";
      }
    });
    return s+"\n";
  }

  t+=block("خرید", buys);
  t+=block("فروش", sells);

  var b=sumOf(buys), sl=sumOf(sells);
  t+=Array(33).join("-")+"\n";
  t+="جمع کل روز:\n";
  if(b.w>0||sl.w>0) t+="  وزن طلا  → خرید "+fmt(b.w)+" گرم | فروش "+fmt(sl.w)+" گرم\n";
  if(b.c>0||sl.c>0) t+="  تعداد سکه → خرید "+fmt(b.c)+" | فروش "+fmt(sl.c)+"\n";
  t+="  مبلغ      → خرید "+fmt(Math.round(b.amt))+" | فروش "+fmt(Math.round(sl.amt))+"\n";

  t+="\nکسر خرید و فروش:\n";
  if(b.w>0||sl.w>0) t+="  وزن طلا  → "+diffStr(b.w, sl.w, " گرم")+"\n";
  if(b.c>0||sl.c>0) t+="  تعداد سکه → "+diffStr(b.c, sl.c, "")+"\n";
  t+="  مبلغ      → "+diffStr(Math.round(b.amt), Math.round(sl.amt), "")+"\n";
  return t;
}
function exportDayText(dkey){
  var t=buildDayText(dkey); if(!t) return;
  downloadText("معاملات-روز-"+dkey+".txt", t);
}
function copyDayText(dkey, btn){
  var t=buildDayText(dkey); if(!t) return;
  copyToClipboard(t, btn);
}

// کپی در کلیپ‌بورد با بازخورد روی دکمه
function copyToClipboard(text, btn){
  function ok(){ if(btn){ var o=btn.textContent; btn.textContent="✓ کپی شد"; setTimeout(function(){btn.textContent=o;},1500); } }
  function fail(){ if(btn){ var o=btn.textContent; btn.textContent="ناموفق"; setTimeout(function(){btn.textContent=o;},1500); } }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(function(){ legacyCopy(text)?ok():fail(); });
  } else { legacyCopy(text)?ok():fail(); }
}
function legacyCopy(text){
  try{
    var ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=document.execCommand("copy"); document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}

// رشته تفاوت برای خروجی متنی
function diffStr(buyVal, sellVal, unit){
  var d=sellVal-buyVal;
  if(d>0) return fmt(d)+unit+" بیشتر فروش";
  if(d<0) return fmt(-d)+unit+" بیشتر خرید";
  return "برابر";
}

/* ---------- خروجی متنی شخص ---------- */
function buildPersonText(name,recs,s,pcode){
  var t="معاملات: "+name+(pcode?" (کد "+pcode+")":"")+"\n"+Array(29).join("=")+"\n\n";
  groupByDay(recs).forEach(function(pair){
    var items=pair[1];
    t+="📅 "+fmtDay(items[0].time)+"\n";
    items.forEach(function(r){
      if(r.cat==="coin"){
        t+="  • "+(r.type==="buy"?"خرید":"فروش")+" سکه | ساعت "+fmtTime(r.time)+" | "+r.coin+" | تعداد "+fmt(r.count)+" | فی "+fmt(r.price)+" | مبلغ "+fmt(Math.round(recValue(r)))+"\n";
      } else {
        t+="  • "+(r.type==="buy"?"خرید":"فروش")+" طلا | ساعت "+fmtTime(r.time)+" | مظنه "+fmt(r.price)+" | وزن "+fmt(r.weight)+" گرم | مبلغ "+fmt(Math.round(recValue(r)))+"\n";
      }
    });
    t+="\n";
  });
  t+=Array(29).join("-")+"\n";
  t+="جمع وزن طلای خرید: "+fmt(s.wBuy)+" گرم\n";
  t+="جمع وزن طلای فروش: "+fmt(s.wSell)+" گرم\n";
  t+="تعداد سکه خرید: "+fmt(s.cBuy)+"\n";
  t+="تعداد سکه فروش: "+fmt(s.cSell)+"\n";
  t+="جمع مبلغ خرید: "+fmt(Math.round(s.amtBuy))+"\n";
  t+="جمع مبلغ فروش: "+fmt(Math.round(s.amtSell))+"\n";
  t+="\nکسر خرید و فروش:\n";
  if(s.wBuy>0||s.wSell>0) t+="  وزن طلا → "+diffStr(s.wBuy, s.wSell, " گرم")+"\n";
  if(s.cBuy>0||s.cSell>0) t+="  تعداد سکه → "+diffStr(s.cBuy, s.cSell, "")+"\n";
  t+="  مبلغ → "+diffStr(Math.round(s.amtBuy), Math.round(s.amtSell), "")+"\n";
  return t;
}
function exportText(name,recs,s,pcode){
  downloadText("معاملات-"+name+".txt", buildPersonText(name,recs,s,pcode));
}
function copyText(name,recs,s,pcode,btn){
  copyToClipboard(buildPersonText(name,recs,s,pcode), btn);
}

/* ---------- خروجی PDF ---------- */
function exportPDF(name,recs,s,pcode){
  var daysHtml=groupByDay(recs).map(function(pair){
    var items=pair[1];
    var rows=items.map(function(r){
      if(r.cat==="coin"){
        return '<tr><td>'+(r.type==="buy"?"خرید":"فروش")+'</td><td>سکه</td><td>'+esc(r.coin)+'</td><td>'+fmtTime(r.time)+'</td><td>'+fmt(r.price)+'</td><td>تعداد '+fmt(r.count)+'</td><td>'+fmt(Math.round(recValue(r)))+'</td></tr>';
      }
      return '<tr><td>'+(r.type==="buy"?"خرید":"فروش")+'</td><td>طلا</td><td>—</td><td>'+fmtTime(r.time)+'</td><td>'+fmt(r.price)+'</td><td>'+fmt(r.weight)+' گرم</td><td>'+fmt(Math.round(recValue(r)))+'</td></tr>';
    }).join("");
    return '<h3>'+fmtDay(items[0].time)+'</h3><table><thead><tr><th>نوع</th><th>دسته</th><th>سکه</th><th>ساعت</th><th>قیمت/مظنه</th><th>وزن/تعداد</th><th>مبلغ</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }).join("");

  var html='<!doctype html><html dir="rtl" lang="fa"><head><meta charset="utf-8"><title>معاملات '+esc(name)+'</title>'+
    '<style>@import url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css");'+
    'body{font-family:Vazirmatn,Tahoma,sans-serif;padding:28px;color:#222}'+
    'h1{color:#b8860b;border-bottom:2px solid #e8b14a;padding-bottom:8px}'+
    'h3{margin-top:22px;color:#555;background:#f6efe0;padding:6px 10px;border-radius:6px}'+
    'table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}'+
    'th,td{border:1px solid #ddd;padding:6px;text-align:center}th{background:#f3e9d2}'+
    '.summary{margin-top:26px;border-top:2px dashed #e8b14a;padding-top:14px}'+
    '.summary div{display:flex;justify-content:space-between;padding:5px 0;font-weight:700}</style></head><body>'+
    '<h1>معاملات: '+esc(name)+(pcode?' <span style="font-size:15px;color:#888">(کد '+esc(pcode)+')</span>':'')+'</h1>'+daysHtml+
    '<div class="summary">'+
      '<div><span>جمع وزن طلای خرید</span><span>'+fmt(s.wBuy)+' گرم</span></div>'+
      '<div><span>جمع وزن طلای فروش</span><span>'+fmt(s.wSell)+' گرم</span></div>'+
      '<div><span>تعداد سکه خرید</span><span>'+fmt(s.cBuy)+'</span></div>'+
      '<div><span>تعداد سکه فروش</span><span>'+fmt(s.cSell)+'</span></div>'+
      '<div><span>جمع مبلغ خرید</span><span>'+fmt(Math.round(s.amtBuy))+'</span></div>'+
      '<div><span>جمع مبلغ فروش</span><span>'+fmt(Math.round(s.amtSell))+'</span></div>'+
    '</div>'+
    '<div class="summary" style="border-top-style:dotted">'+
      '<div style="color:#b8860b">کسر خرید و فروش</div>'+
      ((s.wBuy>0||s.wSell>0)?'<div><span>وزن طلا</span><span>'+diffStr(s.wBuy,s.wSell," گرم")+'</span></div>':'')+
      ((s.cBuy>0||s.cSell>0)?'<div><span>تعداد سکه</span><span>'+diffStr(s.cBuy,s.cSell,"")+'</span></div>':'')+
      '<div><span>مبلغ</span><span>'+diffStr(Math.round(s.amtBuy),Math.round(s.amtSell),"")+'</span></div>'+
    '</div>'+
    '<script>window.onload=function(){setTimeout(function(){window.print();},500);};<\/script></body></html>';

  var w=window.open("","_blank");
  if(w){ w.document.write(html); w.document.close(); }
  else { alert("لطفاً اجازه باز شدن پنجره را بدهید تا PDF ساخته شود."); }
}

/* ---------- تب‌ها ---------- */
document.querySelectorAll(".tabs .tab[data-tab]").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll(".tabs .tab[data-tab]").forEach(function(x){x.classList.remove("active");});
    b.classList.add("active");
    state.tab=b.getAttribute("data-tab");
    if(state.tab==="search"){ state.selectedPerson=null; state.selectedDay=null; }
    render();
  };
});

render();
